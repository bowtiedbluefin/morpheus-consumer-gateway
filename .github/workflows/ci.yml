name: Verify gateway
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.lock
      - run: .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/ruff check gateway node_helper devtools tests scripts deploy
      - run: .venv/bin/ruff format --check gateway node_helper devtools tests scripts deploy
      - run: .venv/bin/pytest -q
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx prettier --check src e2e playwright.config.ts package.json tsconfig.json vite.config.ts index.html
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - run: docker compose build
        env:
          ETH_NODE_ADDRESS: https://rpc.example.invalid
